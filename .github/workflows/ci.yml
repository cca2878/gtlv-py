name: CI

on:
  push:
    branches: [dev, main] # dev 为快照验证，main 为合并后的正式验证
  pull_request:
    branches: [main] # dev -> main 的 PR 门禁

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust + Python (lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 遵循 rust-toolchain.toml，使 CI 与本地 `make lint` 用同一工具链。
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: python -m pip install --upgrade "maturin>=1.0,<2.0" "mypy>=1.19"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # 经 maturin 构建，同时验证 gtlv-core 内嵌的模型可用。
      - name: Install the package
        run: python -m pip install .

      - name: mypy
        env:
          MYPYPATH: python
        run: mypy --python-version 3.10 python/gtlv tests

      - name: Python tests
        run: python -m unittest discover -s tests
