[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gtlv"
# Version lives in Cargo.toml; maturin propagates it here.
dynamic = ["version"]
description = "Local GeeTest V3 solving primitives with an async client, no runtime dependencies"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Repository = "https://github.com/cca2878/gtlv-py"

[project.optional-dependencies]
dev = ["maturin>=1.0,<2.0", "mypy>=1.19"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "gtlv._native"
exclude = ["**/__pycache__/**", "**/*.pyc"]
