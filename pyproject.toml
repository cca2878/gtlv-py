[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gtlv"
# Version lives in Cargo.toml; maturin propagates it here.
dynamic = ["version"]
description = "Local gt V3 click and slide solving with an async client and embedded models"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "cryptography>=41",  # w 参数所需的 AES-CBC 与 RSA
    "pillow>=9",         # 滑动背景的解码、重排与差分
]

[project.urls]
Repository = "https://github.com/cca2878/gtlv-py"

[project.optional-dependencies]
dev = ["maturin>=1.0,<2.0", "mypy>=1.19"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "gtlv._native"
exclude = ["**/__pycache__/**", "**/*.pyc"]
