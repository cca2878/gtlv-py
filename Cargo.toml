[package]
name = "gtlv-py"
version = "0.1.1"
edition = "2021"
description = "极验 V3 点选/滑动求解的 Python 绑定：Rust 本地原语 + Python async 编排"
license = "AGPL-3.0-only"
repository = "https://github.com/cca2878/gtlv-py"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# 推理核与内嵌模型。模型随该 crate 携带，本包无需任何模型文件。
# 固定到具体 revision：模型即其产物的一部分，升级须是显式动作。
gtlv-core = { git = "https://github.com/cca2878/gtlv-core", rev = "30ab9063e6ef2059075011e7f4f5cf463fefb8d5" }
# abi3-py310：对 CPython 稳定 ABI 编译，一个 wheel 覆盖 3.10 及以后所有版本。
# 与 requires-python = ">=3.10" 一致。
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
